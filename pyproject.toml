[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1sim"
version = "0.1.0"
description = "Neuroevolution racing simulation on real F1 circuits, with FastF1 ghost laps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # <3.4: the app is only tested on arcade 3.3
    "arcade>=3.3.3,<3.4",
    "fastf1>=3.7",
    "numpy>=2.0",
    "platformdirs>=4.0",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.scripts]
f1sim = "f1sim.cli:main"

[project.optional-dependencies]
# Compiles the ray casts and track projection: 17.6x -> 64x real time with 64 cars
fast = ["numba>=0.60"]
# CMA-ES optimiser (f1sim.agents.optimisers.CMAES); the GA default needs nothing extra
es = ["cma>=4.0"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["f1sim*"]

[tool.setuptools.package-data]
# Bundled UI fonts (SIL OFL 1.1, see THIRD_PARTY.md) with their licences
"f1sim.app" = [
    "assets/fonts/*/*.ttf",
    "assets/fonts/*/OFL.txt",
    "assets/hero/stage/*.webp",
    "assets/hero/stage/*.json",
    "assets/hero/drive/*.webp",
    "assets/hero/drive/*.json",
    "assets/hero/*.npz",
    "assets/hero/*.webp",
    "assets/geo/*.npz",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ first so each git worktree tests its own code, not the editable install
pythonpath = ["src"]
addopts = "-ra -m 'not network'"
markers = ["network: needs internet (FastF1 / GitHub); run with -m network"]
